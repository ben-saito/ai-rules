name: ai-rules

# 自リポジトリの規約が古くなっていないかを検証する。
on: [pull_request, push]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install git+https://github.com/ben-saito/ai-rules
      - run: ai-rules check
